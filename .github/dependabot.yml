version: 2

# The Git submodule under vendor/ is deliberately absent here, even though
# Dependabot could handle it. A bump on its own would not produce a valid
# state: data/providers.json is generated from it and has to move in the same
# commit, or the CI check fails. That is what
# .github/workflows/update-registry.yml is for - it does both together.

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates bundled, so that five separate pull requests
      # do not show up every week.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

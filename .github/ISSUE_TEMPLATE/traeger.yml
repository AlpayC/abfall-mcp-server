name: Träger liefert keine Termine
description: Für eine Adresse kommen keine oder falsche Abfuhrtermine.
labels: [traeger]
body:
  - type: markdown
    attributes:
      value: |
        Bitte **keine vollständige Wohnanschrift** posten — Straße und Ort
        genügen, die Hausnummer darfst du weglassen oder verfälschen. Issues
        sind öffentlich und werden von Suchmaschinen erfasst.

        Fehlt ein Träger **komplett**, gehört das meist stromaufwärts zu
        [hacs_waste_collection_schedule](https://github.com/mampfes/hacs_waste_collection_schedule) —
        von dort kommt die Datenbasis, und alle profitieren davon. Wenn du
        unsicher bist, frag hier ruhig zuerst.

  - type: input
    id: ort
    attributes:
      label: Ort und Straße
      placeholder: "Emsdetten, Kirchstraße"
    validations:
      required: true

  - type: input
    id: traeger
    attributes:
      label: Zuständiger Entsorgungsträger
      description: Falls bekannt. `finde_traeger` zeigt Name und ID.
      placeholder: "Kreis Steinfurt (app_abfallplus_de.kreis-steinfurt.f0b5f6)"

  - type: dropdown
    id: status
    attributes:
      label: Was kam zurück?
      options:
        - "fehlgeschlagen – kein Träger lieferte Termine"
        - "rueckfrage – Nachfrage, die ich nicht beantworten kann"
        - "leer – Träger antwortet ohne Termine"
        - "kein_traeger – zur Adresse wurde keiner gefunden"
        - "ok – aber die Termine sind falsch"
    validations:
      required: true

  - type: textarea
    id: antwort
    attributes:
      label: Antwort des Servers
      description: >
        Die Felder `meldung`, `versuche` bzw. `verwendete_argumente` sind das
        Aussagekräftigste. Ort und Hausnummer darfst du darin schwärzen.
      render: json
    validations:
      required: true

  - type: textarea
    id: sonst
    attributes:
      label: Sonstiges
      description: >
        Funktioniert der Abfuhrkalender auf der Website des Trägers? Falls du
        die Portaladresse kennst, hilft sie beim Nachstellen.

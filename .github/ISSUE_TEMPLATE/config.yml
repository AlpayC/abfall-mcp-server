blank_issues_enabled: true
contact_links:
  - name: An authority is missing entirely, or its portal changed
    url: https://github.com/mampfes/hacs_waste_collection_schedule/issues
    about: >
      That is where the data comes from. Added there, it arrives here with the
      next update - and every other project using it benefits too.
  - name: Question or idea
    url: https://github.com/AlpayC/mcp-abfall/discussions
    about: For anything that is not a bug report yet.
  - name: Security vulnerability
    url: https://github.com/AlpayC/mcp-abfall/security/advisories/new
    about: Please report privately, not as a public issue.

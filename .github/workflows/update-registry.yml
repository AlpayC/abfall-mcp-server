name: Update data source

# Pulls the latest hacs_waste_collection_schedule, rebuilds the registry and
# opens a pull request when anything changed.
#
# Why a dedicated workflow instead of Dependabot: a submodule bump on its own
# does not produce a valid state here. data/providers.json is generated from
# the submodule and has to move in the same commit, or the CI check fails.
# Dependabot cannot do that - it does not know about the build step.

on:
  schedule:
    # Monday mornings. Upstream releases continuously; weekly is enough for new
    # authorities to arrive without flooding the repository.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Record the current authority count
        run: |
          count=$(uv run python -c "import json; print(json.load(open('data/providers.json', encoding='utf-8'))['count'])")
          echo "before=$count" >> "$GITHUB_ENV"

      - name: Update the submodule
        run: |
          git submodule update --remote --depth 1 vendor/hacs_waste_collection_schedule
          cd vendor/hacs_waste_collection_schedule
          echo "upstream=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild the registry
        run: uv run python scripts/build_registry.py

      - name: Authority count afterwards
        run: |
          count=$(uv run python -c "import json; print(json.load(open('data/providers.json', encoding='utf-8'))['count'])")
          echo "after=$count" >> "$GITHUB_ENV"

      # Tests run here so that no pull request is opened that is already red on
      # arrival - for instance because upstream renamed a source module or
      # changed an argument signature.
      - name: Tests against the new state
        id: tests
        continue-on-error: true
        run: uv run pytest

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-source/update
          title: "Update data source (${{ env.before }} → ${{ env.after }} authorities)"
          commit-message: |
            Update data source

            Submodule bumped to ${{ env.upstream }}, registry rebuilt.
            Authorities: ${{ env.before }} → ${{ env.after }}.
          body: |
            Automated run: submodule bumped to `${{ env.upstream }}` and
            `data/providers.json` rebuilt.

            | | Authorities |
            |---|---|
            | before | ${{ env.before }} |
            | after | ${{ env.after }} |

            Tests: **${{ steps.tests.outcome }}**

            On `failure`, please look before merging — usually upstream renamed
            a source module or changed an argument signature.

            A drop in the authority count needs an explanation: either something
            was removed upstream, or the country assignment stopped matching.
          labels: data-source
          delete-branch: true

name: Release

# Triggered by a version tag:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Deliberately without publishing to PyPI: the package only runs from a
# repository checkout. It resolves the data source under vendor/ and the
# registry under data/ relative to the project root, and the submodule does
# not belong in a distribution archive. A wheel on PyPI would install cleanly
# and still not work - hence a source release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Check tag against package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(uv run python -c 'import abfall_mcp_server; print(abfall_mcp_server.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package version $version."
            exit 1
          fi
          echo "version=${version#v}" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Lint and tests
        run: |
          uv run ruff check src scripts tests
          uv run pytest

      - name: Registry matches the submodule
        run: |
          uv run python scripts/build_registry.py
          git diff --quiet -- data/providers.json \
            || { echo "::error::Registry is not up to date."; exit 1; }

      - name: Cut the release notes from the changelog
        run: |
          # The file is written directly instead of redirecting stdout: the
          # changelog contains umlauts and arrows, which would otherwise tie
          # the output to the runtime's encoding.
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["version"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # This version's section, up to the next heading.
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          notes = (match.group(1) if match else "").strip()
          pathlib.Path("release-notes.md").write_text(
              notes or f"See CHANGELOG.md for {version}.", encoding="utf-8"
          )
          PY
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.tag, '-') }}

  # Der Container, den die Website im Docker-Tab nennt. Ohne diesen Job zeigt
  # sie auf ein Image, das es nicht gibt.
  container:
    name: Container
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/abfall-mcp-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Eintrag in der offiziellen MCP-Registry. Die Anmeldung laeuft ueber GitHub
  # OIDC, es liegt also kein langlebiges Token im Repository. Der Name in
  # server.json muss zum Repository passen, sonst weist die Registry ab.
  registry:
    name: MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Check server.json against the tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          if [ "$tag" != "v$version" ]; then
            echo "::error file=server.json::server.json says $version, tag is $tag."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"             | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

name: MCP migration check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check MCP endpoint
        uses: AlpayC/mcp-migration-check@v1
        with:
          url: https://abfall-mcp.alpaycelik.dev/mcp
          fail-on: critical

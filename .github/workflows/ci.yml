name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      # Without the submodule the data source is missing; the tests import
      # the source modules. Shallow clone, only the current state matters.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Tests
        run: uv run pytest

  registry:
    name: Registry matches the submodule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # data/providers.json is generated from the submodule and checked in so
      # that the server starts without a build step. The build is deterministic
      # and needs no network, so we can verify outright that the committed file
      # matches the committed submodule state.
      - name: Rebuild the registry
        run: uv run python scripts/build_registry.py

      - name: Check for drift
        run: |
          if ! git diff --quiet -- data/providers.json; then
            echo "::error file=data/providers.json::The registry does not match the submodule state. Please run 'uv run python scripts/build_registry.py' and commit the result."
            git diff --stat -- data/providers.json
            exit 1
          fi
          echo "Registry is up to date."

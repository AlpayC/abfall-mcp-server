[project]
name = "abfall-mcp-server"
# Einzige Quelle der Versionsnummer ist src/abfall_mcp_server/__init__.py -
# der Release-Workflow gleicht den Tag dagegen ab.
dynamic = ["version"]
description = "MCP-Server fuer Abfall-/Umweltkalender aller deutschen Staedte und Landkreise"
readme = "README.md"
authors = [{ name = "AlpayC" }]
keywords = ["mcp", "abfall", "abfallkalender", "muellkalender", "deutschland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.4",
    "icalendar>=4.0.9",
    "icalevents>=0.2.1",
    "python-dateutil>=2.8.2",
    "pytz>=2021.3",
    "PyYAML>=6.0.1",
    "pycryptodome>=3.20.0",
    "pypdf>=5.1.0",
    "pdfminer.six>=20221105",
    "curl_cffi>=0.7.0",
    "urllib3>=1.26.18",
    "jinja2>=3.1.2",
    "typing_extensions>=4.12.2",
    "inquirer>=3.4.1",
]

[project.scripts]
abfall-mcp-server = "abfall_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/abfall_mcp_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/abfall_mcp_server"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
# Das Submodule bringt eigene Tests mit, die eine Home-Assistant-Umgebung
# erwarten. Sie gehoeren nicht zu diesem Projekt.
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
ignore = [
    # Die Gegenstellen sind fremde Portale: welche Ausnahme dort auftritt,
    # ist nicht vorhersagbar. Ein Ausfall darf den naechsten Traeger nicht
    # blockieren, deshalb wird breit gefangen und die Meldung weitergereicht.
    "BLE001",
    # Abfuhrtermine sind kalendarische Ortsdaten ohne Zeitzonenbezug.
    "DTZ011",
    # Die Stoppwortliste bleibt als umbrochener Text lesbar.
    "SIM905",
]
